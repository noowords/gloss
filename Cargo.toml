[workspace]
resolver = "3"
members = [
    "apps/api",
    "crates/bootstrap",
    "crates/presentation",
    "crates/infrastructure",
    "crates/application",
    "crates/domain"
]

[workspace.dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "uuid", "chrono", "macros", "json", "bigdecimal"] }
uuid = { version = "1.23", features = ["v7", "serde", "fast-rng"] }
bigdecimal = { version = "0.4", features = ["serde"] }
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
anyhow = "1.0.103"
reqwest = "0.12"
axum = "0.8"

bootstrap = { path = "./crates/bootstrap" }
presentation = { path = "./crates/presentation" }
infrastructure = { path = "./crates/infrastructure" }
application = { path = "./crates/application" }
domain = { path = "./crates/domain" }
